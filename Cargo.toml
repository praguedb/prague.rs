[package]
name = "prague"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A read-only Rust consumer for Prague caches: typed in-memory caches fed by compacted Kafka topics."
repository = "https://github.com/praguedb/prague.rs"
publish = false

[features]
default = ["kafka"]
# The Kafka feeder, on Confluent's native Rust client.
kafka = ["dep:confluent-kafka", "dep:tokio"]

[dependencies]
rust_decimal = { version = "1", default-features = false, features = ["std"] }
confluent-kafka = { version = "1", optional = true }
tokio = { version = "1", features = ["sync", "time", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
